<script>
// ===========================================================================
// A 10 x 10 km block of Champaign County, Illinois, centred on 40.15 N /

// farmyards and building footprints are real. OSM does not record what is

// ===========================================================================
const HALF = WORLD.half;
const CELL = 0.8, CH = 16, CHSPAN = CH*CELL, CHUNKS = 16;
const SURFN = 2048, FIELDN = 1024;
const MASKN = 256, BLK = 32;
const WHEAT = 0, CORN = 1, SOY = 2, FALLOW = 3, GRASS = 4, WOOD = 5, BUILT = 6;
const CROP_NAME = ['winter wheat','corn','soybeans','worked ground','grass','timber','the yard','the airstrip'];
const YIELD = [0.019, 0.032, 0.013];        // bushels per 0.64 m^2 cell

let _seed = 20260907;
const rnd = () => (_seed = (_seed*1664525 + 1013904223) >>> 0) / 4294967296;
const $ = id => document.getElementById(id);

// ------------------------------------------------------------- rasterising
const px = (v, n) => (v + HALF)/(2*HALF)*n;
function drawWays(ctx, n, ways, style, closed, widthOf){
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.fillStyle = ctx.strokeStyle = style;
  for(const w of ways){
    const p = w.p || w;
    if(p.length < 4) continue;
    ctx.beginPath();
    ctx.moveTo(px(p[0], n), px(p[1], n));
    for(let i = 2; i < p.length; i += 2) ctx.lineTo(px(p[i], n), px(p[i+1], n));
    if(closed){ ctx.closePath(); ctx.fill(); }
    else { ctx.lineWidth = Math.max(1, widthOf(w)/(2*HALF)*n); ctx.stroke(); }
  }
}
function buildSurface(){
  const c = document.createElement('canvas'); c.width = c.height = SURFN;
  const g = c.getContext('2d');
  const pass = fn => {
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = '#000'; g.fillRect(0, 0, SURFN, SURFN);
    g.globalCompositeOperation = 'lighter';
    fn();
    return g.getImageData(0, 0, SURFN, SURFN).data;
  };
  const a = pass(() => {
    drawWays(g, SURFN, WORLD.roads, '#f00', false, w => w.w + 11);
    drawWays(g, SURFN, WORLD.water.filter(w => !w.a), '#0f0', false, () => 7);
    drawWays(g, SURFN, WORLD.water.filter(w => w.a), '#0f0', true);
    drawWays(g, SURFN, WORLD.roads.filter(r => r.w >= 13), '#00f', false, w => w.w);
  });
  const b = pass(() => drawWays(g, SURFN, WORLD.roads, '#f00', false, w => w.w));
  const out = new Uint8Array(SURFN*SURFN*4);
  for(let i = 0; i < SURFN*SURFN; i++){
    out[i*4] = b[i*4]; out[i*4+1] = a[i*4+1]; out[i*4+2] = a[i*4+2]; out[i*4+3] = a[i*4];
  }
  const t = new THREE.DataTexture(out, SURFN, SURFN, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  t.needsUpdate = true;
  return {tex: t, data: out};
}
function buildFields(){
  const c = document.createElement('canvas'); c.width = c.height = FIELDN;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, FIELDN, FIELDN);
  drawWays(g, FIELDN, WORLD.roads, '#f00', false, w => w.w + 6);
  drawWays(g, FIELDN, WORLD.water.filter(w => !w.a), '#f00', false, () => 10);
  drawWays(g, FIELDN, WORLD.water.filter(w => w.a), '#f00', true);
  drawWays(g, FIELDN, WORLD.built, '#0f0', true);
  drawWays(g, FIELDN, WORLD.farmyard, '#0f0', true);
  drawWays(g, FIELDN, WORLD.wood.filter(w => w.a), '#00f', true);
  drawWays(g, FIELDN, WORLD.wood.filter(w => !w.a), '#00f', false, () => 14);
  const src = g.getImageData(0, 0, FIELDN, FIELDN).data;
  const N = FIELDN*FIELDN, kind = new Uint8Array(N);
  for(let i = 0; i < N; i++){
    if(src[i*4+2] > 90) kind[i] = 3;
    else if(src[i*4+1] > 90) kind[i] = 2;
    else if(src[i*4] > 90) kind[i] = 1;
  }
  const label = new Int32Array(N).fill(-1), stack = new Int32Array(N), size = [];
  let next = 0;
  for(let s = 0; s < N; s++){

    const id = next++; let sp = 0, cnt = 0;
    stack[sp++] = s; label[s] = id;
    while(sp > 0){
      const p = stack[--sp]; cnt++;
      const x = p % FIELDN, y = (p/FIELDN)|0;
      if(x > 0 && !kind[p-1] && label[p-1] < 0){ label[p-1] = id; stack[sp++] = p-1; }
      if(x < FIELDN-1 && !kind[p+1] && label[p+1] < 0){ label[p+1] = id; stack[sp++] = p+1; }
      if(y > 0 && !kind[p-FIELDN] && label[p-FIELDN] < 0){ label[p-FIELDN] = id; stack[sp++] = p-FIELDN; }
      if(y < FIELDN-1 && !kind[p+FIELDN] && label[p+FIELDN] < 0){ label[p+FIELDN] = id; stack[sp++] = p+FIELDN; }
    }
    size.push(cnt);
  }
  const SUB = 390/(2*HALF/FIELDN);
  const hashi = (a, b) => {
    let h = Math.imul(a, 374761393) ^ Math.imul(b, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0)/4294967296;
  };

  for(let i = 0; i < N; i++){
    const x = i % FIELDN, y = (i/FIELDN)|0;
    let code = GRASS;
    if(kind[i] === 3) code = WOOD;
    else if(kind[i] === 2) code = BUILT;
    else if(kind[i] === 0){
      const id = label[i];
      if(size[id] >= 45){
        const fid = id*7919 + Math.floor(x/SUB)*31 + Math.floor(y/SUB)*17;
        const r = hashi(fid, 12345);
        code = r < 0.50 ? CORN : r < 0.94 ? SOY : r < 0.985 ? WHEAT : FALLOW;

        out[i*4+2] = Math.floor(hashi(fid, 21)*255);

  }

  return {tex: t, data: out};
}

const clampi = (v, n) => Math.min(n-1, Math.max(0, Math.floor(v)));
function fieldCodeAt(x, z){
  if(Math.abs(x) >= HALF || Math.abs(z) >= HALF) return GRASS;
  return fields.data[(clampi(px(z, FIELDN), FIELDN)*FIELDN + clampi(px(x, FIELDN), FIELDN))*4]/32;
}
function roadAt(x, z){
  if(Math.abs(x) >= HALF || Math.abs(z) >= HALF) return 0;
  return surf.data[(clampi(px(z, SURFN), SURFN)*SURFN + clampi(px(x, SURFN), SURFN))*4]/255;
}

// The yard sits on a real OSM farmyard: the one nearest the middle of the
// extract, so the machines start somewhere that is already a farm.
const BASE_XZ = (function(){
  let best = [0,0], bestD = 1e9;
  for(const p of WORLD.farmyard){
    let sx = 0, sz = 0;
    for(let i = 0; i < p.length; i += 2){ sx += p[i]; sz += p[i+1]; }
    const cx = sx/(p.length/2), cz = sz/(p.length/2), d = Math.hypot(cx, cz);
    if(d < bestD && Math.abs(cx) < HALF-400 && Math.abs(cz) < HALF-400){ bestD = d; best = [cx, cz]; }
  }
  return best;
})();

// A dirt strip, cut into the field map so the crop shader clears it and the
// ground shader draws packed earth. Placed on the longest run of open ground
// near the yard that no road or water crosses.
const AIRSTRIP = (function(){
  const L = 620, W = 30;
  let best = null, bestD = 1e9;
  const clear = (cx, cz, ax, az) => {
    for(let t = -L/2; t <= L/2; t += 12) for(let u = -W/2; u <= W/2; u += 10){
      const x = cx + ax*t - az*u, z = cz + az*t + ax*u;
      if(Math.abs(x) > HALF-120 || Math.abs(z) > HALF-120) return false;
      const c = fieldCodeAt(x, z);
      if(c === WOOD || c === BUILT || roadAt(x, z) > 0.05) return false;
      if(surf.data[(clampi(px(z,SURFN),SURFN)*SURFN + clampi(px(x,SURFN),SURFN))*4+1] > 60) return false;
    }
    return true;
  };
  for(let i = 0; i < 9000; i++){
    const a = rnd()*Math.PI*2, r = 150 + rnd()*900;
    const cx = BASE_XZ[0] + Math.cos(a)*r, cz = BASE_XZ[1] + Math.sin(a)*r;
    for(const dir of [[1,0],[0,1]]){
      if(!clear(cx, cz, dir[0], dir[1])) continue;
      if(r < bestD){ bestD = r; best = {x:cx, z:cz, ax:dir[0], az:dir[1], L:L, W:W}; }
    }
    if(best && bestD < 320) break;
  }
  if(!best) best = {x:BASE_XZ[0]+260, z:BASE_XZ[1], ax:1, az:0, L:L, W:W};
  // burn it into the field raster
  const step = 2*HALF/FIELDN;
  for(let t = -L/2; t <= L/2; t += step*0.5) for(let u = -W/2; u <= W/2; u += step*0.5){
    const x = best.x + best.ax*t - best.az*u, z = best.z + best.az*t + best.ax*u;
    const ix = clampi(px(x, FIELDN), FIELDN), iy = clampi(px(z, FIELDN), FIELDN);
    fields.data[(iy*FIELDN + ix)*4] = 7*32;
  }
  fields.tex.needsUpdate = true;
  return best;
})();

// A tilt-shift style depth of field. The scene goes to an offscreen buffer at
// a slight supersample (which also buys back the antialiasing a render target
// costs), then a single pass blurs it by screen distance from the band the
// player is standing in. Distant fields go soft, so the crop tiers change and
// the far edge of the window resolve into haze instead of a visible seam.
const SS = 1.25;
const rt = new THREE.WebGLRenderTarget(2, 2,
  {minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, format:THREE.RGBAFormat});
const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const postUni = {
  tDiffuse:{value:rt.texture}, uTexel:{value:new THREE.Vector2()},
  uFocusY:{value:0.42}, uAmount:{value:3.4}
};
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: postUni, depthTest:false, depthWrite:false,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy,0.,1.); }',
  fragmentShader: `
    varying vec2 vUv;
    uniform sampler2D tDiffuse; uniform vec2 uTexel;
    uniform float uFocusY; uniform float uAmount;
    void main(){
      // ground recedes up the screen, so blur grows above the focus band
      // faster than below it
      float dy = vUv.y - uFocusY;
      float d = dy > 0.0 ? dy/0.52 : -dy/0.34;
      float r = smoothstep(0.12, 1.0, d) * uAmount;
      vec4 c = texture2D(tDiffuse, vUv);
      if(r < 0.4){ gl_FragColor = c; return; }
      vec4 sum = c; float w = 1.0;
      // two rings of taps; enough for a soft field at these radii
      for(int i = 0; i < 8; i++){
        float a = float(i)*0.7853981;
        vec2 o = vec2(cos(a), sin(a));
        sum += texture2D(tDiffuse, vUv + o*uTexel*r);       w += 1.0;
        sum += texture2D(tDiffuse, vUv + o*uTexel*r*0.5);   w += 1.0;
      }
      gl_FragColor = sum/w;
    }`
})));

// One directional light does duty as both sun and moon; everything else —

function updateSky(dt){
  tod = (tod + dt*24/dayLength) % 24;
  const th = (tod - 6)/12*Math.PI;          // 0 at 06:00, PI at 18:00
  const sinE = Math.sin(th);
  // blend night -> dawn -> day by sun elevation
  let a, b, t;
  if(sinE <= 0.0){ a = SKY.night; b = SKY.dawn; t = THREE.MathUtils.clamp(sinE/0.18 + 1, 0, 1); }
  else if(sinE < 0.30){ a = SKY.dawn; b = SKY.day; t = sinE/0.30; }
  else { a = SKY.day; b = SKY.day; t = 1; }
  skyTmp.top.copy(a.top).lerp(b.top, t);
  skyTmp.bot.copy(a.bot).lerp(b.bot, t);
  skyTmp.sun.copy(a.sun).lerp(b.sun, t);
  skyTmp.hemi.copy(a.hemi).lerp(b.hemi, t);
  const amb = a.amb + (b.amb - a.amb)*t, str = a.str + (b.str - a.str)*t;
  skyUni.uTop.value.copy(skyTmp.top);
  skyUni.uBot.value.copy(skyTmp.bot);
  scene.fog.color.copy(skyTmp.bot);
  hemi.color.copy(skyTmp.hemi);
  hemi.intensity = amb;
  sun.color.copy(skyTmp.sun);
  sun.intensity = str;
  // below the horizon the same light stands in for the moon, from the far side
  const night = sinE <= 0;
  const e = night ? Math.max(0.22, -sinE) : sinE;
  const c = Math.cos(th) * (night ? -1 : 1);
  return {dir:new THREE.Vector3(c*0.75, e, 0.42).normalize(), night: sinE < 0.06};
}

// -------------------------------------------------- worked-ground mask
// R: worked. G: direction of travel. B: 0 = ploughed to soil, 1 = harvested
// to stubble. Sparse 32x32 blocks hold the truth; a scrolling window of them
// is mirrored into a texture the field shaders read.
const maskData = new Uint8Array(MASKN*MASKN*4);
const maskTex = new THREE.DataTexture(maskData, MASKN, MASKN, THREE.RGBAFormat);
maskTex.minFilter = maskTex.magFilter = THREE.LinearFilter;
maskTex.needsUpdate = true;
const blocks = new Map();
const maskOrigin = new THREE.Vector2(0, 0);
let maskDirty = false, workedCells = 0;
let pendingWork = [];
const keyOf = (cx, cy) => Math.floor(cx/BLK) + ',' + Math.floor(cy/BLK);

function writeTexel(cx, cy, v){
  const ix = cx - maskOrigin.x, iy = cy - maskOrigin.y;
  if(ix < 0 || iy < 0 || ix >= MASKN || iy >= MASKN) return;
  const o = (iy*MASKN + ix)*4;
  maskData[o] = 255;
  maskData[o+1] = (v & 2) ? 255 : 0;
  maskData[o+2] = (v & 4) ? 255 : 0;
  maskDirty = true;
}
// v packs: bit0 worked, bit1 direction, bit2 harvested rather than ploughed
function setCell(cx, cy, v, local){
  const key = keyOf(cx, cy);
  let b = blocks.get(key);
  if(!b){ b = new Uint8Array(BLK*BLK); blocks.set(key, b); }
  const li = (((cy % BLK)+BLK)%BLK)*BLK + (((cx % BLK)+BLK)%BLK);
  if(b[li]) return false;
  b[li] = v; workedCells++;
  writeTexel(cx, cy, v);
  if(local) pendingWork.push(cx, cy, v);
  return true;
}
function recenterMask(cx, cy){
  const ox = Math.floor((cx - MASKN/2)/BLK)*BLK, oy = Math.floor((cy - MASKN/2)/BLK)*BLK;
  if(ox === maskOrigin.x && oy === maskOrigin.y) return;
  maskOrigin.set(ox, oy);
  maskData.fill(0);
  for(let by = 0; by < MASKN/BLK; by++) for(let bx = 0; bx < MASKN/BLK; bx++){
    const b = blocks.get((ox/BLK + bx) + ',' + (oy/BLK + by));
    if(!b) continue;
    for(let ly = 0; ly < BLK; ly++) for(let lx = 0; lx < BLK; lx++){
      const v = b[ly*BLK + lx];
      if(!v) continue;
      const o = ((by*BLK + ly)*MASKN + (bx*BLK + lx))*4;
      maskData[o] = 255;
      maskData[o+1] = (v & 2) ? 255 : 0;
      maskData[o+2] = (v & 4) ? 255 : 0;
    }
  }
  maskDirty = true;
}

// ------------------------------------------------------------- shared GLSL
const uTime = {value:0}, uMask = {value:maskTex}, uMaskOrigin = {value:maskOrigin},
      uMaskN = {value:MASKN}, uCell = {value:CELL}, uSurf = {value:surf.tex},
      uField = {value:fields.tex}, uHalf = {value:HALF},
      uFocus = {value:new THREE.Vector2()}, uGrowEdge = {value:40},
      uCropScale = {value:1}, uPlantScale = {value:1};
const shared = sh => {
  sh.uniforms.uTime = uTime; sh.uniforms.uMask = uMask;
  sh.uniforms.uMaskOrigin = uMaskOrigin; sh.uniforms.uMaskN = uMaskN;
  sh.uniforms.uCell = uCell; sh.uniforms.uSurf = uSurf;
  sh.uniforms.uField = uField; sh.uniforms.uHalf = uHalf;
  sh.uniforms.uFocus = uFocus; sh.uniforms.uGrowEdge = uGrowEdge;
  sh.uniforms.uCropScale = uCropScale; sh.uniforms.uPlantScale = uPlantScale;
};
const DECL = 'uniform float uTime;\nuniform sampler2D uMask;\nuniform vec2 uMaskOrigin;\n' +
  'uniform float uMaskN;\nuniform float uCell;\nuniform sampler2D uSurf;\n' +
  'uniform sampler2D uField;\nuniform float uHalf;\nuniform vec2 uFocus;\nuniform float uGrowEdge;\nuniform float uCropScale;\nuniform float uPlantScale;\n';
const GLSL = `
  vec2 hash22(vec2 p){
    vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.xx + p3.yz) * p3.zy);
  }
  float hash12(vec2 p){
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
  }
  bool outside(vec2 w){ return max(abs(w.x), abs(w.y)) >= uHalf; }
  // the colour a field reads as from a distance; the ground and the canopy
  // sheets both derive from this, so they cannot drift apart
  vec3 fieldColour(float code, float ripe){
    if(code < 0.5) return vec3(0.804,0.706,0.376);
    if(code < 1.5) return mix(vec3(0.353,0.494,0.204), vec3(0.663,0.573,0.310), ripe);
    return mix(vec3(0.302,0.435,0.173), vec3(0.604,0.627,0.290), ripe);
  }
  vec4 fieldAt(vec2 w){ return texture2D(uField, (w + uHalf)/(2.0*uHalf)); }
  vec4 surfAt(vec2 w){ return texture2D(uSurf, (w + uHalf)/(2.0*uHalf)); }
  vec4 workAt(vec2 cellf){
    vec2 mi = cellf - uMaskOrigin;
    if(mi.x < 0.0 || mi.y < 0.0 || mi.x >= uMaskN || mi.y >= uMaskN) return vec4(0.0);
    return texture2D(uMask, (mi + 0.5)/uMaskN);
  }
`;

// ------------------------------------------------------------------ ground
// NOTE: w is a vec2 of (world x, world z) — its second component is w.y.
const groundMat = new THREE.MeshLambertMaterial({color:0xffffff});
groundMat.onBeforeCompile = sh => {
  shared(sh);
  sh.vertexShader = 'varying vec3 vWPos;\n' + sh.vertexShader.replace(
    '#include <begin_vertex>',
    '#include <begin_vertex>\n vWPos = (modelMatrix*vec4(transformed,1.0)).xyz;');
  sh.fragmentShader = 'varying vec3 vWPos;\n' + DECL + GLSL +
    sh.fragmentShader.replace('#include <color_fragment>', `
      vec2 w = vWPos.xz;
      vec4 fd = fieldAt(w);
      float code = floor(fd.r*255.0/32.0 + 0.5);
      float rowX = step(0.5, fd.g);
      float ripe = fd.b, tint = fd.a;
      vec2 nz = mod(w, 1024.0);
      vec3 grass = vec3(0.451,0.549,0.278);
      vec3 col = grass;
      if(outside(w))       col = grass*0.94;
      else if(code < 2.5)  col = fieldColour(code, ripe);
      else if(code < 3.5)  col = vec3(0.361,0.271,0.161);
      else if(code > 6.5){                       // the dirt strip
        col = vec3(0.596,0.529,0.404);
        col *= 0.93 + 0.14*hash12(floor(nz*1.2));
      }
      else if(code > 5.5)  col = vec3(0.404,0.478,0.263);
      else if(code > 4.5)  col = vec3(0.220,0.353,0.180);
      bool crop = (code < 2.5) && !outside(w);
      col *= 0.93 + tint*0.14;
      if(crop){
        float acr = mix(w.x, w.y, rowX), alg = mix(w.y, w.x, rowX);
        float rp = abs(fract(acr/uCell) - 0.5);
        col *= 1.0 - (code < 0.5 ? 0.05 : 0.20)*smoothstep(0.18, 0.5, rp);
        col *= 1.0 + 0.035*sin(alg/9.3);
        col *= 0.97 + 0.06*hash12(floor(nz*0.08));
      }
      col *= 0.94 + 0.12*hash12(floor(nz*2.0));
      vec4 sf = surfAt(w);
      col = mix(col, grass*1.04, smoothstep(0.18, 0.62, sf.a));
      float water = smoothstep(0.25, 0.6, sf.g);
      col = mix(col, vec3(0.216,0.310,0.290), water);
      float road = smoothstep(0.42, 0.58, sf.r);
      vec3 gravel = mix(vec3(0.545,0.518,0.451), vec3(0.267,0.267,0.278),
                        smoothstep(0.3, 0.7, sf.b));
      gravel *= 0.9 + 0.2*hash12(floor(nz*5.0));
      col = mix(col, gravel, road);

      vec4 mk = workAt(floor(w/uCell));
      float t = smoothstep(0.12, 0.88, mk.r)*(1.0 - road)*(1.0 - water);
      float sv = mix(w.y, w.x, step(0.5, mk.g));
      float ridge = sin(sv*4.3)*0.5 + 0.5, clod = hash12(floor(nz*6.0));
      vec3 soil = mix(vec3(0.286,0.196,0.110), vec3(0.443,0.329,0.196), ridge);
      soil = mix(soil, soil*1.18, clod*0.55);
      // a combine leaves standing stubble and chaff, not turned earth
      vec3 stub = mix(vec3(0.616,0.565,0.353), vec3(0.729,0.686,0.475), ridge);
      stub = mix(stub, vec3(0.404,0.353,0.216), clod*0.35);
      col = mix(col, mix(soil, stub, step(0.5, mk.b)), t);
      diffuseColor.rgb = pow(col, vec3(2.2));
      #include <color_fragment>`);
};
// The ground is exactly the extract and no larger, so the world ends in a clean
// cut at the county block's edge rather than fading into invented grass.
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2*HALF, 2*HALF), groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
{ // a shallow rim so the cut edge reads as soil, not paper

// ------------------------------------------------------------------- crops
const sRGB = h => new THREE.Color(h).convertSRGBToLinear();
function GeoBuilder(){
  const pos = [], nor = [], col = [], can = [], idx = [];
  return {
    flag: 0,                    // 1 while emitting canopy sheet vertices
    v(x,y,z,nx,ny,nz,c){ pos.push(x,y,z); nor.push(nx,ny,nz); col.push(c.r,c.g,c.b);
                         can.push(this.flag);
                         return pos.length/3 - 1; },
    tri(a,b,c){ idx.push(a,b,c); },
    quad(a,b,c,d){ idx.push(a,b,c, a,c,d); },
    done(h){
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3));
      g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
      g.setAttribute('aCanopy', new THREE.Float32BufferAttribute(can,1));
      g.setIndex(idx);
      g.boundingSphere = new THREE.Sphere(new THREE.Vector3(0,h/2,0),
        Math.SQRT2*CHSPAN/2 + h + 1.0);
      return g;
    }
  };
}
function buildWheat(){
  const b = GeoBuilder();
  const cB = sRGB(0x5c6b32), cM = sRGB(0xb8a959), cT = sRGB(0xd8bd6c), cH = sRGB(0xe6c974);
  for(let s = 0; s < 4; s++){
    const a = (s/4)*Math.PI*2 + rnd()*0.9, r = 0.06 + rnd()*0.26;
    const ox = Math.cos(a)*r, oz = Math.sin(a)*r, h = 1.0*(0.75 + rnd()*0.4);
    const ln = 0.1 + rnd()*0.16, lx = Math.cos(a)*ln, lz = Math.sin(a)*ln;
    const fa = rnd()*Math.PI, fx = Math.cos(fa), fz = Math.sin(fa), w0 = 0.035 + rnd()*0.012;
    const ring = (t,w,c) => { const y = h*t, bx = ox + lx*t*t, bz = oz + lz*t*t;
      return [b.v(bx-fx*w,y,bz-fz*w,-fx,0.35,-fz,c), b.v(bx+fx*w,y,bz+fz*w,fx,0.35,fz,c), bx,bz,y]; };
    const r0 = ring(0,w0,cB), r1 = ring(0.58,w0*0.7,cB.clone().lerp(cM,0.8)), r2 = ring(0.88,w0*0.5,cT);

function wheelGeo(R, W, c){
  const parts = [
    {geo:new THREE.CylinderGeometry(R,R,W,14), c:RUBBER, m:TR(0,0,0,0,0,Math.PI/2)},
    {geo:new THREE.CylinderGeometry(R*0.45,R*0.45,W+0.06,10), c:c, m:TR(0,0,0,0,0,Math.PI/2)}
  ];
  for(let i = 0; i < 8; i++){
    const a = i/8*Math.PI*2;
    const m = new THREE.Matrix4().makeRotationX(-a);
    m.setPosition(0, Math.sin(a)*R*0.8, Math.cos(a)*R*0.8);
    parts.push({geo:new THREE.BoxGeometry(W+0.06, R*0.16, R*0.52), c:0x2c2c30, m:m});
  }
  return merge(parts);
}
function addWheels(group, wheels, spec){
  for(const w of spec){
    const m = new THREE.Mesh(wheelGeo(w[2], w[3], w[4]), painted);
    m.castShadow = true;
    m.rotation.order = 'YXZ';      // steer, then roll — otherwise it wobbles
    m.position.set(w[0], w[2], w[1]);
    group.add(m);
    wheels.push({m:m, R:w[2], steer:w[5]});
  }
}

// ------------------------------------------------------------------- dust
const DUST = 160;
const dustGeo = new THREE.BufferGeometry();
const dpos = new Float32Array(DUST*3);
for(let i = 0; i < DUST; i++) dpos[i*3+1] = -50;
dustGeo.setAttribute('position', new THREE.BufferAttribute(dpos,3));
dustGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);
// sizeAttenuation divides by view depth, which an orthographic camera does not
// supply meaningfully — it renders the specks enormous. Fixed pixel size.

  color:0xa98a5f, size:3.0, sizeAttenuation:false,
  transparent:true, opacity:0.5, depthWrite:false})));
const dlife = new Float32Array(DUST), dvel = new Float32Array(DUST*3);
let dnext = 0;
// Grain the auger throws. Each kernel carries a real share of the tank, so it
// only reaches the cart if the cart is actually under the spout — miss, and it
// spills on the ground.
const MAXG = 700, BU_PER_KERNEL = 0.5;
const grainGeo = new THREE.BufferGeometry();
const gpos = new Float32Array(MAXG*3);
for(let i = 0; i < MAXG; i++) gpos[i*3+1] = -50;
grainGeo.setAttribute('position', new THREE.BufferAttribute(gpos,3));
grainGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);
scene.add(new THREE.Points(grainGeo, new THREE.PointsMaterial({
  color:0xe0b24a, size:4.0, sizeAttenuation:false, depthWrite:false})));
const gvel = new Float32Array(MAXG*3);
const glive = new Uint8Array(MAXG);
let gnext = 0, spilled = 0;

function emitKernel(x, y, z, vx, vy, vz){
  gnext = (gnext + 1) % MAXG;
  const j = gnext;
  gpos[j*3] = x; gpos[j*3+1] = y; gpos[j*3+2] = z;
  gvel[j*3] = vx; gvel[j*3+1] = vy; gvel[j*3+2] = vz;
  glive[j] = 1;
}
// returns true if this kernel was caught
function catchKernel(x, y, z){
  const cart = vehicles[2];
  if(y > cart.box.top || y < cart.box.top - 2.2) return false;
  const dx = x - cart.g.position.x, dz = z - cart.g.position.z;
  const c = Math.cos(-cart.heading), sn = Math.sin(-cart.heading);
  const lx = dx*c - dz*sn, lz = dx*sn + dz*c;
  // a little more forgiving than the visible box, so running alongside at
  // speed is a skill rather than a pixel-perfect alignment puzzle
  if(Math.abs(lx) > cart.box.hx + 0.7 || Math.abs(lz) > cart.box.hz + 0.7) return false;
  if(cart.grain >= cart.tank) return false;
  cart.grain = Math.min(cart.tank, cart.grain + BU_PER_KERNEL);
  return true;
}
function stepGrain(dt){
  for(let j = 0; j < MAXG; j++){
    if(!glive[j]) continue;
    gvel[j*3+1] -= 12.0*dt;
    const x = gpos[j*3] + gvel[j*3]*dt;
    const y = gpos[j*3+1] + gvel[j*3+1]*dt;
    const z = gpos[j*3+2] + gvel[j*3+2]*dt;
    gpos[j*3] = x; gpos[j*3+1] = y; gpos[j*3+2] = z;
    if(gvel[j*3+1] < 0 && catchKernel(x, y, z)){ glive[j] = 0; gpos[j*3+1] = -50; continue; }
    if(y <= 0.05){
      // into the pit at the yard, otherwise it is on the ground and lost
      if(Math.hypot(x - (BASE.x - 9), z - (BASE.z - 19)) < 16) stored += BU_PER_KERNEL;
      else spilled += BU_PER_KERNEL;
      glive[j] = 0; gpos[j*3+1] = -50;
    }
  }
  grainGeo.attributes.position.needsUpdate = true;
}
let augerAcc = 0;
function runAuger(v, dt){
  if(!v.spout || !v.auger || v.grain <= 0) return;
  augerAcc += dt*22;                       // kernels per second
  const n = Math.floor(augerAcc);
  if(n <= 0) return;
  augerAcc -= n;
  const c = Math.cos(v.heading), sn = Math.sin(v.heading);
  const sx = v.spout[0], sy = v.spout[1], sz = v.spout[2];
  const wx = v.g.position.x + sx*c + sz*sn;
  const wz = v.g.position.z - sx*sn + sz*c;
  const fwd = v.speed;
  for(let i = 0; i < n && v.grain > 0; i++){
    v.grain = Math.max(0, v.grain - BU_PER_KERNEL);
    const ox = (Math.random()-0.5)*0.5, oz = (Math.random()-0.5)*0.5;
    // thrown out along the auger, and carried by whatever the combine is doing
    emitKernel(wx + ox, sy, wz + oz,
      -1.5*c + Math.sin(v.heading)*fwd + (Math.random()-0.5)*0.5,
      -0.6,
       1.5*sn + Math.cos(v.heading)*fwd + (Math.random()-0.5)*0.5);
  }
}

function puff(x, z, spread){
  dnext = (dnext + 1) % DUST;
  const j = dnext;
  dpos[j*3] = x + (Math.random()-0.5)*spread;
  dpos[j*3+1] = 0.25;
  dpos[j*3+2] = z + (Math.random()-0.5)*spread;
  dvel[j*3] = (Math.random()-0.5)*0.6;
  dvel[j*3+1] = 0.8 + Math.random();
  dvel[j*3+2] = (Math.random()-0.5)*0.6;
  dlife[j] = 1;
}

// ------------------------------------------------------------------- spray
const SPRAY = 260;
const sprayGeo = new THREE.BufferGeometry();
const spos = new Float32Array(SPRAY*3);
for(let i = 0; i < SPRAY; i++) spos[i*3+1] = -50;
sprayGeo.setAttribute('position', new THREE.BufferAttribute(spos,3));
sprayGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);
scene.add(new THREE.Points(sprayGeo, new THREE.PointsMaterial({
  color:0xdff0f4, size:5.0, sizeAttenuation:false,
  transparent:true, opacity:0.34, depthWrite:false})));
const slife = new Float32Array(SPRAY), svel = new Float32Array(SPRAY*3);
let snext = 0, dusted = 0;
function mist(x, y, z, vx, vz){
  snext = (snext + 1) % SPRAY;
  const j = snext;
  spos[j*3] = x; spos[j*3+1] = y; spos[j*3+2] = z;
  svel[j*3] = vx*0.25 + (Math.random()-0.5)*1.2;
  svel[j*3+1] = -1.1 - Math.random()*0.6;
  svel[j*3+2] = vz*0.25 + (Math.random()-0.5)*1.2;

}

// ------------------------------------------------------------- multiplayer
// PeerJS's public broker only does the introductions; after that every message
// travels peer to peer over a DataChannel, so there is nothing to deploy. The
// host holds the authoritative worked-ground state and relays transforms.
const net = {peer:null, conns:[], host:false, id:null, on:false};
const remotes = new Map();
const mplog = t => { $('mplog').textContent = t; };
let driving = -1, towedBy = -1, stored = 0;

function netSend(obj, except){
  if(!net.on) return;
  const s = JSON.stringify(obj);
  for(const c of net.conns) if(c.open && c !== except) c.send(s);
}
function snapshot(){
  const bl = [];
  for(const [k, v] of blocks){
    let any = false;
    for(let i = 0; i < v.length; i++) if(v[i]){ any = true; break; }
    if(any) bl.push([k, Array.from(v)]);
  }
  return {t:'snap', blocks:bl};
}
function applyBlocks(bl){
  for(const [k, arr] of bl){
    let b = blocks.get(k);
    if(!b){ b = new Uint8Array(BLK*BLK); blocks.set(k, b); }
    const parts = k.split(','), bx = +parts[0], by = +parts[1];
    for(let i = 0; i < arr.length; i++){
      if(arr[i] && !b[i]){
        b[i] = arr[i]; workedCells++;
        writeTexel(bx*BLK + (i % BLK), by*BLK + ((i/BLK)|0), arr[i]);
      }
    }
  }
}
function handle(msg, conn){
  if(msg.t === 'snap') applyBlocks(msg.blocks);
  else if(msg.t === 'work'){
    const a = msg.c;
    for(let i = 0; i < a.length; i += 3) setCell(a[i], a[i+1], a[i+2], false);
    if(net.host) netSend(msg, conn);
  }
  else if(msg.t === 'state'){
    let r = remotes.get(msg.id);
    if(!r){
      const m = buildFarmer();
      scene.add(m);
      r = {mesh:m, x:msg.p[0], z:msg.p[1], h:msg.h};
      remotes.set(msg.id, r);
      $('peers').textContent = (remotes.size + 1) + ' players';
    }
    r.tx = msg.p[0]; r.tz = msg.p[1]; r.th = msg.h; r.veh = msg.v;
    if(msg.v >= 0 && msg.v !== driving){
      const v = vehicles[msg.v];
      v.g.position.set(msg.p[0], 0, msg.p[1]);
      v.heading = msg.h; v.g.rotation.y = msg.h;
    }
    // the driver is the one moving grain about, so take their word for it
    if(msg.g && driving < 0){
      vehicles[1].grain = msg.g[0]; vehicles[2].grain = msg.g[1]; stored = msg.g[2];
    }
    if(net.host) netSend(msg, conn);
  }
  else if(msg.t === 'claim'){
    vehicles[msg.v].owner = msg.id;
    if(net.host) netSend(msg, conn);
    if(msg.id && msg.id !== net.id && driving === msg.v) dismount(true);
  }
  else if(msg.t === 'bye'){
    const r = remotes.get(msg.id);
    if(r){ scene.remove(r.mesh); remotes.delete(msg.id); }
    for(const v of vehicles) if(v.owner === msg.id) v.owner = null;
    $('peers').textContent = remotes.size ? (remotes.size + 1) + ' players' : 'solo';
    if(net.host) netSend(msg, conn);
  }
}
function wire(conn){
  net.conns.push(conn);
  conn.on('data', d => { try { handle(JSON.parse(d), conn); } catch(e){} });
  conn.on('open', () => {
    if(net.host) conn.send(JSON.stringify(snapshot()));
    mplog((net.host ? 'hosting — ' : 'connected — ') +
          net.conns.filter(c => c.open).length + ' peer(s)');
  });
  conn.on('close', () => {
    net.conns = net.conns.filter(c => c !== conn);
    mplog('a peer left');
  });
}
function startNet(asHost){
  if(!window.Peer){ mplog('PeerJS did not load — staying offline'); return; }
  const code = ($('room').value || 'urbana').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  $('room').value = code;
  net.host = asHost;
  try {
    net.peer = asHost ? new Peer('farma-' + code) : new Peer();
    net.peer.on('open', id => {
      net.id = id; net.on = true;
      if(asHost) mplog('hosting "' + code + '" — share that code');
      else { wire(net.peer.connect('farma-' + code, {reliable:true})); mplog('joining "' + code + '"…'); }
    });
    net.peer.on('connection', c => wire(c));
    net.peer.on('error', e => mplog('net: ' + e.type));
  } catch(e){ mplog('net failed: ' + e.message); }
}
$('host').onclick = () => startNet(true);
$('join').onclick = () => startNet(false);
addEventListener('beforeunload', () => netSend({t:'bye', id:net.id}));

// ---------------------------------------------------------------- controls
const keys = {};
function nearestVehicle(x, z, maxD){
  let best = -1, bd = maxD;
  for(let i = 0; i < vehicles.length; i++){
    const v = vehicles[i];
    if(!v.canDrive) continue;
    const d = Math.hypot(v.g.position.x - x, v.g.position.z - z);
    if(d < bd){ bd = d; best = i; }
  }
  return best;
}
function mount(i){
  const v = vehicles[i];
  if(v.owner && v.owner !== net.id) return;
  driving = i;
  v.owner = net.id || 'me';
  farmer.visible = false;
  netSend({t:'claim', v:i, id:v.owner});
}
function dismount(forced){
  if(driving < 0) return;
  const v = vehicles[driving];
  if(!forced && v.kind === 'plane' && (v.alt > 0.2 || Math.abs(v.speed) > 2)) return;
  const a = v.heading + Math.PI/2;
  farmer.position.set(v.g.position.x + Math.cos(a)*(v.radius + 1.4), 0,
                      v.g.position.z + Math.sin(a)*(v.radius + 1.4));
  farmerHeading = v.heading;
  farmer.visible = true;
  v.speed = 0;
  if(!forced){ v.owner = null; netSend({t:'claim', v:driving, id:null}); }
  driving = -1;
}
function unload(){
  if(driving < 0) return;
  const v = vehicles[driving];
  if(v.kind === 'plane') v.duster = !v.duster;
  else if(v.spout) v.auger = !v.auger;
}
addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  keys[k] = true;
  if(k === 'f'){
    if(driving >= 0) dismount(false);
    else { const i = nearestVehicle(farmer.position.x, farmer.position.z, 7); if(i >= 0) mount(i); }
  }
  if(k === 'p' && driving >= 0 && vehicles[driving].tool)
    vehicles[driving].toolDown = !vehicles[driving].toolDown;
  if(k === 'h' && driving >= 0){
    const cart = vehicles[2], v = vehicles[driving];
    if(towedBy === driving) towedBy = -1;
    else if(Math.hypot(cart.g.position.x - v.g.position.x,
                       cart.g.position.z - v.g.position.z) < 16) towedBy = driving;
  }
  if(k === 'u') unload();
  if(k === 'l') lampsForced = !lampsForced;
  if(k === ',') tod = (tod + 23) % 24;
  if(k === '.') tod = (tod + 1) % 24;
  if(k === '[') { VIEW = Math.min(VIEW_MAX, VIEW*1.3); applyView(); }
  if(k === ']') { VIEW = Math.max(VIEW_MIN, VIEW/1.3); applyView(); }
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].indexOf(k) >= 0) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ------------------------------------------------------------ working land
function workSwath(v){
  if(!v.tool || !v.toolDown || Math.abs(v.speed) < 0.4) return;
  const cs = Math.cos(v.heading), sn = Math.sin(v.heading);
  const harvest = v.kind === 'combine';
  const flag = 1 | (Math.abs(sn) > Math.abs(cs) ? 2 : 0) | (harvest ? 4 : 0);
  const hw = v.toolWidth/2, steps = Math.ceil(v.toolWidth/CELL) + 1;
  let got = 0;
  for(let i = 0; i <= steps; i++){
    const off = -hw + i*(v.toolWidth/steps);
    for(let b = 0; b < 3; b++){
      const back = v.toolBack + (harvest ? -b*0.4 : -b*0.45);
      const wx = v.g.position.x + off*cs + back*sn;
      const wz = v.g.position.z - off*sn + back*cs;
      const code = fieldCodeAt(wx, wz);
      if(harvest && code > SOY) continue;
      if(setCell(Math.floor(wx/CELL), Math.floor(wz/CELL), flag, true) && harvest)
        got += YIELD[code];
    }
  }
  if(harvest){
    if(got > 0) v.grain = Math.min(v.tank, v.grain + got);
    puff(v.g.position.x + 1.5*sn, v.g.position.z + 1.5*cs, 3.6);
  } else puff(v.g.position.x - 3*sn, v.g.position.z - 3*cs, 3.2);
}

// ------------------------------------------------------------------ minimap
const mini = $('mini'), mg = mini.getContext('2d');
const miniImg = mg.createImageData(190, 190);
for(let y = 0; y < 190; y++) for(let x = 0; x < 190; x++){
  const code = fields.data[(Math.floor(y/190*FIELDN)*FIELDN + Math.floor(x/190*FIELDN))*4]/32;
  const road = surf.data[(Math.floor(y/190*SURFN)*SURFN + Math.floor(x/190*SURFN))*4];
  let c = [115,140,71];
  if(code === WHEAT) c = [205,180,96];
  else if(code === CORN) c = [110,140,60];
  else if(code === SOY) c = [82,116,48];
  else if(code === FALLOW) c = [92,69,41];
  else if(code === WOOD) c = [56,90,46];
  else if(code === BUILT) c = [140,133,118];
  if(road > 80) c = [225,222,214];
  const o = (y*190 + x)*4;
  miniImg.data[o] = c[0]; miniImg.data[o+1] = c[1]; miniImg.data[o+2] = c[2]; miniImg.data[o+3] = 255;
}

// -------------------------------------------------------------------- loop
const tmp = new THREE.Vector3();
const fpsEl = $('fps'), dcEl = $('dc');
let last = performance.now(), shadowTick = 0, fpsT = 0, fpsN = 0, netT = 0, workT = 0;
let lastCalls = 0, lastTris = 0;
$('helpbtn').onclick = () => { $('help').hidden = !$('help').hidden; };
$('ctl').innerHTML =
  '<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> drive / walk &middot; <kbd>F</kbd> get in / out<br>' +
  '<kbd>P</kbd> tool up/down &middot; <kbd>H</kbd> hitch cart &middot; <kbd>U</kbd> auger / duster &middot; <kbd>L</kbd> lamps<br><kbd>,</kbd><kbd>.</kbd> time of day<br>' +
  '<kbd>Q</kbd><kbd>E</kbd> rotate &middot; <kbd>wheel</kbd> / <kbd>[</kbd><kbd>]</kbd> zoom &middot; ' +
  '<kbd>Space</kbd> brake &middot; <kbd>Shift</kbd> climb';

function driveVehicle(v, dt){
  const up = keys['w'] || keys['arrowup'], dn = keys['s'] || keys['arrowdown'];
  const lf = keys['a'] || keys['arrowleft'], rt = keys['d'] || keys['arrowright'];
  if(up) v.speed += v.accel*dt;
  else if(dn) v.speed -= v.accel*0.85*dt;
  else v.speed -= Math.sign(v.speed)*Math.min(Math.abs(v.speed), 5*dt);
  if(keys[' ']) v.speed -= Math.sign(v.speed)*Math.min(Math.abs(v.speed), 16*dt);
  if(v.tool && v.toolDown) v.speed -= Math.sign(v.speed)*Math.min(Math.abs(v.speed), 1.6*dt);
  v.speed = Math.max(v.maxR, Math.min(v.maxF, v.speed));
  const tgt = (lf ? 1 : 0) + (rt ? -1 : 0);
  v.steer += (tgt*0.55 - v.steer)*Math.min(1, 8*dt);
  v.heading += v.steer*v.speed*v.turn*dt*(v.rearSteer ? -1 : 1);
  v.g.rotation.y = v.heading;
  v.g.position.x = Math.max(-HALF, Math.min(HALF, v.g.position.x + Math.sin(v.heading)*v.speed*dt));
  v.g.position.z = Math.max(-HALF, Math.min(HALF, v.g.position.z + Math.cos(v.heading)*v.speed*dt));
  v.spin += v.speed*dt;
  for(const w of v.wheels){
    w.m.rotation.x = -v.spin/w.R;
    w.m.rotation.y = w.steer ? v.steer*0.9 : 0;
  }
  if(v.tool) v.tool.position.y += ((v.toolDown ? 0 : 0.8) - v.tool.position.y)*Math.min(1, 6*dt);
}

// Arcade flight: she rolls like a vehicle until there is enough speed over the
// wing, then turns on the wing instead of the tailwheel.
function flyPlane(v, dt){
  const up = keys['w'] || keys['arrowup'], dn = keys['s'] || keys['arrowdown'];
  const lf = keys['a'] || keys['arrowleft'], rt = keys['d'] || keys['arrowright'];
  if(up) v.speed += v.accel*dt;
  else if(dn) v.speed -= v.accel*1.2*dt;
  else v.speed -= Math.sign(v.speed)*Math.min(Math.abs(v.speed), 3.2*dt);
  if(keys[' '] && !v.airborne) v.speed -= Math.sign(v.speed)*Math.min(Math.abs(v.speed), 18*dt);
  v.speed = Math.max(v.maxR, Math.min(v.maxF, v.speed));

  const TAKEOFF = 26;
  v.airborne = v.alt > 0.05 || v.speed > TAKEOFF;
  const tgt = (lf ? 1 : 0) + (rt ? -1 : 0);
  v.steer += (tgt - v.steer)*Math.min(1, 6*dt);
  v.heading += v.steer*(v.airborne ? 0.55 : v.speed*v.turn*0.25)*dt;
  if(v.airborne){
    let rate;
    if(v.speed > TAKEOFF) rate = keys['shift'] ? 9 : (keys[' '] ? -9 : (v.alt < 12 ? 3 : 0));
    else rate = -7;                        // below flying speed she sinks
    v.climb += (rate - v.climb)*Math.min(1, 3*dt);
    v.alt = Math.max(0, v.alt + v.climb*dt);
  } else { v.climb = 0; v.alt = 0; }

  v.g.position.x = Math.max(-HALF, Math.min(HALF, v.g.position.x + Math.sin(v.heading)*v.speed*dt));
  v.g.position.z = Math.max(-HALF, Math.min(HALF, v.g.position.z + Math.cos(v.heading)*v.speed*dt));
  v.g.position.y = v.alt;
  v.g.rotation.set(THREE.MathUtils.clamp(-v.climb*0.035, -0.3, 0.3),
                   v.heading, -v.steer*0.55*(v.airborne ? 1 : 0.15), 'YXZ');
  v.spin += v.speed*dt;
  for(const w of v.wheels) w.m.rotation.x = v.airborne ? 0 : -v.spin/w.R;
  v.prop.rotation.z += (4 + v.speed)*dt*6;
  v.disc.visible = v.speed > 6;

  if(v.duster && v.airborne && v.alt < 42 && v.speed > 10){
    const c = Math.cos(v.heading), sn = Math.sin(v.heading);
    for(let i = 0; i < 3; i++){
      const off = (Math.random()-0.5)*v.toolWidth;
      mist(v.g.position.x + off*c, v.alt + 0.9, v.g.position.z - off*sn,
           Math.sin(v.heading)*v.speed, Math.cos(v.heading)*v.speed);
    }
    if(fieldCodeAt(v.g.position.x, v.g.position.z) <= SOY)
      dusted += v.toolWidth*Math.abs(v.speed)*dt/10000;
  }
}

function frame(now){
  const dt = Math.min((now - last)/1000, 0.05); last = now;
  uTime.value = now*0.001;

  if(driving >= 0){
    const v = vehicles[driving];
    if(v.kind === 'plane') flyPlane(v, dt);
    else { driveVehicle(v, dt); workSwath(v); runAuger(v, dt); }
    farmer.position.set(v.g.position.x, 0, v.g.position.z);
  } else {
    let mx = 0, mz = 0;
    if(keys['w'] || keys['arrowup']) mz -= 1;
    if(keys['s'] || keys['arrowdown']) mz += 1;
    if(keys['a'] || keys['arrowleft']) mx -= 1;
    if(keys['d'] || keys['arrowright']) mx += 1;
    const len = Math.hypot(mx, mz);
    if(len > 0){
      const sp = (keys['shift'] ? 4.8 : 2.2)*dt;
      const ca = Math.cos(camAngle), sa = Math.sin(camAngle);
      const wx = (mx*ca + mz*sa)/len, wz = (-mx*sa + mz*ca)/len;
      farmer.position.x = Math.max(-HALF, Math.min(HALF, farmer.position.x + wx*sp));
      farmer.position.z = Math.max(-HALF, Math.min(HALF, farmer.position.z + wz*sp));
      farmerHeading = Math.atan2(wx, wz);
      walkPhase += sp*3.4;
    }
    farmer.rotation.y = farmerHeading;
    farmer.position.y = Math.abs(Math.sin(walkPhase))*0.045;
  }

  // the cart trails its hitch like a real trailer
  const cart = vehicles[2];
  if(towedBy >= 0 && towedBy !== 2){
    const tv = vehicles[towedBy];
    const hx = tv.g.position.x + Math.sin(tv.heading)*tv.hitchZ;
    const hz = tv.g.position.z + Math.cos(tv.heading)*tv.hitchZ;
    let dx = cart.g.position.x - hx, dz = cart.g.position.z - hz;
    const d = Math.hypot(dx, dz) || 1e-3;
    const L = 5.2;
    cart.heading = Math.atan2(dx/d, dz/d);
    cart.g.rotation.y = cart.heading;
    cart.g.position.x = hx + dx/d*L;
    cart.g.position.z = hz + dz/d*L;
    cart.spin += tv.speed*dt;
    for(const w of cart.wheels) w.m.rotation.x = -cart.spin/w.R;
  }

  const active = driving >= 0 ? vehicles[driving].g.position : farmer.position;
  uFocus.value.set(active.x, active.z);
  // roughly how far the ground reaches at this zoom, capped by the live window
  uGrowEdge.value = 150;    // the plant fade below retires them long before this
  // Zooming out, a plant stops being resolvable long before the crop layer is
  // switched off. Tiers coarsen first, then the canopy — which is already the
  // ground's own colour — settles flat into it. Nothing pops.
  // The frame corner reaches 102 m of ground at about VIEW 50, which is where
  // the crop window's own edge would come into view, so everything is faded out
  // before then.
  // Plants are near-field detail; past that the ground shader is the field.
  // Both fades are smooth and finish well inside the chunk window, so no edge
  // of the crop layer is ever on screen.
  uPlantScale.value = 1 - THREE.MathUtils.clamp((VIEW - 26)/16, 0, 1);
  uCropScale.value = 1;
  // Tier boundaries stay at fixed world distances. Scaling them with the zoom
  // walked the first boundary into frame, and that is what showed.
  placeChunks(active.x, active.z);
  recenterMask(Math.floor(active.x/CELL), Math.floor(active.z/CELL));

  for(let j = 0; j < DUST; j++){
    if(dlife[j] <= 0){ dpos[j*3+1] = -50; continue; }
    dlife[j] -= dt*0.9;
    dpos[j*3] += dvel[j*3]*dt; dpos[j*3+1] += dvel[j*3+1]*dt; dpos[j*3+2] += dvel[j*3+2]*dt;
    dvel[j*3+1] -= 0.6*dt;
  }
  dustGeo.attributes.position.needsUpdate = true;
  for(let j = 0; j < SPRAY; j++){
    if(slife[j] <= 0){ spos[j*3+1] = -50; continue; }
    slife[j] -= dt*0.45;
    spos[j*3] += svel[j*3]*dt; spos[j*3+1] += svel[j*3+1]*dt; spos[j*3+2] += svel[j*3+2]*dt;
    if(spos[j*3+1] < 0.3) slife[j] = 0;
  }
  sprayGeo.attributes.position.needsUpdate = true;
  stepGrain(dt);
  // a full cart parked at the yard augers itself into the bins
  if(cart.grain > 0 && Math.hypot(cart.g.position.x - (BASE.x - 9),
                                  cart.g.position.z - (BASE.z - 19)) < 18){
    const moved = Math.min(cart.grain, 45*dt);
    cart.grain -= moved; stored += moved;
  }
  const fill = cart.grain/cart.tank;
  cart.heap.visible = fill > 0.005;
  cart.heap.scale.y = Math.max(0.02, fill);
  cart.heap.position.y = 1.15 + fill*0.5;
  if(maskDirty){ maskTex.needsUpdate = true; maskDirty = false; }

  // individual plants and shadows stop meaning anything once you are looking
  // at whole sections, so drop them and let the ground shader carry the view
  const near = uPlantScale.value > 0.02;
  for(const m of chunkMeshes) m.visible = near;
  farmer.castShadow = VIEW < 46;

  if(keys['q']) camAngle += 1.2*dt;
  if(keys['e']) camAngle -= 1.2*dt;
  const d = Math.max(60, VIEW*4);
  tmp.set(Math.sin(camAngle)*d, d*0.82, Math.cos(camAngle)*d).add(active);
  camera.position.lerp(tmp, Math.min(1, 6*dt));
  camera.lookAt(active.x, active.y + 1, active.z);   // follows the plane up
  const sky = updateSky(dt);
  sun.position.set(active.x + sky.dir.x*70, sky.dir.y*70 + 4, active.z + sky.dir.z*70);
  sun.target.position.set(active.x, 0, active.z);
  sun.target.updateMatrixWorld();

  // lamps come on at dusk, or whenever the driver insists
  const lampsOn = lampsForced || sky.night;
  for(const y of yardLamps){
    y.light.intensity = lampsOn ? 1.5 : 0;
    y.head.material = lampsOn ? lampOnMat : lampOffMat;
  }
  const drv = driving >= 0 ? vehicles[driving] : null;
  for(let i = 0; i < 2; i++){
    const on = lampsOn && drv && drv.beamAt;
    beams[i].intensity = on ? 2.4 : 0;
    if(!on) continue;
    const c = Math.cos(drv.heading), sn = Math.sin(drv.heading);
    const side = (i ? 1 : -1)*0.75;
    const bx = drv.g.position.x + side*c + drv.beamAt[2]*sn;
    const bz = drv.g.position.z - side*sn + drv.beamAt[2]*c;
    beams[i].position.set(bx, drv.beamAt[1], bz);
    beams[i].target.position.set(bx + sn*26, 0.2, bz + c*26);
    beams[i].target.updateMatrixWorld();
  }
  for(const v of vehicles) for(const m of v.lamps) m.visible = lampsOn;
  if(near && ++shadowTick % 2 === 0) renderer.shadowMap.needsUpdate = true;

  for(const [, r] of remotes){
    r.x += (r.tx - r.x)*Math.min(1, 10*dt);
    r.z += (r.tz - r.z)*Math.min(1, 10*dt);
    let dh = r.th - r.h;
    while(dh > Math.PI) dh -= 2*Math.PI;
    while(dh < -Math.PI) dh += 2*Math.PI;
    r.h += dh*Math.min(1, 10*dt);
    r.mesh.position.set(r.x, 0, r.z);
    r.mesh.rotation.y = r.h;
    r.mesh.visible = !(r.veh >= 0);
  }

  if(net.on && now - netT > 66){
    netT = now;
    netSend({t:'state', id:net.id, p:[active.x, active.z],
             h: driving >= 0 ? vehicles[driving].heading : farmerHeading, v:driving,
             g: driving >= 0 ? [vehicles[1].grain, vehicles[2].grain, stored] : null});
  }
  if(pendingWork.length && now - workT > 220){
    workT = now;
    if(net.on) netSend({t:'work', c:pendingWork});
    pendingWork = [];
  }

  // where the player is, in screen space, is where the picture stays sharp
  tmp.set(active.x, active.y + 1, active.z).project(camera);
  postUni.uFocusY.value = THREE.MathUtils.clamp(tmp.y*0.5 + 0.5, 0.2, 0.8);
  postUni.uAmount.value = VIEW < 46 ? 3.4 : 1.6;   // less useful zoomed right out

  renderer.setRenderTarget(rt);
  renderer.clear();
  renderer.render(bgScene, bgCam);
  renderer.render(scene, camera);
  const sceneCalls = renderer.info.render.calls;   // before the blit resets it
  const sceneTris = renderer.info.render.triangles;
  renderer.setRenderTarget(null);
  renderer.clear();
  renderer.render(postScene, postCam);
  lastCalls = sceneCalls; lastTris = sceneTris;

  fpsN++;
  if(now - fpsT > 400){
    fpsEl.textContent = (fpsN*1000/(now - fpsT)).toFixed(0);
    dcEl.textContent = lastCalls + ' / ' + (lastTris/1000).toFixed(0) + 'k tri';
    fpsT = now; fpsN = 0;
    const v = driving >= 0 ? vehicles[driving] : null;
    $('line1').textContent = (v ? 'Driving the ' + v.name + ' · ' +
      Math.abs(v.speed*3.6).toFixed(0) + ' km/h · tool ' + (v.toolDown ? 'DOWN' : 'UP')
      : 'On foot — F to get in') + ' · ' + CROP_NAME[fieldCodeAt(active.x, active.z)] +
      ' · ' + String(Math.floor(tod)).padStart(2,'0') + ':' +
      String(Math.floor((tod%1)*60)).padStart(2,'0');
    if(v && v.kind === 'plane')
      $('line1').textContent = 'Flying the duster - ' +
        Math.abs(v.speed*3.6).toFixed(0) + ' km/h - ' + v.alt.toFixed(0) + ' m - duster ' +
        (v.duster ? 'ON' : 'off');
    $('line2').textContent = 'Worked ' + (workedCells*CELL*CELL/10000).toFixed(2) + ' ha · combine ' +
      vehicles[1].grain.toFixed(0) + '/' + vehicles[1].tank + ' bu (auger ' +
      (vehicles[1].auger ? 'on' : 'off') + ') · cart ' + vehicles[2].grain.toFixed(0) + '/' +
      vehicles[2].tank + ' bu · bins ' + stored.toFixed(0) + ' bu' +
      (dusted > 0.01 ? ' · dusted ' + dusted.toFixed(1) + ' ha' : '') +
      (spilled > 1 ? ' · spilled ' + spilled.toFixed(0) : '');
    mg.putImageData(miniImg, 0, 0);
    mg.fillStyle = '#e03030';
    mg.beginPath(); mg.arc(px(active.x,190), px(active.z,190), 3.5, 0, 7); mg.fill();
  }
  requestAnimationFrame(frame);
}
$('load').remove();
placeChunks(farmer.position.x, farmer.position.z, true);
recenterMask(Math.floor(farmer.position.x/CELL), Math.floor(farmer.position.z/CELL));
requestAnimationFrame(frame);
</script>
</body>
</html>
